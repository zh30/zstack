name: codex
display_name: Legacy Codex compatibility root
skills_root: ~/.codex/skills
link_mode: symlink
# Current Codex discovers user skills from ~/.agents/skills. Keep this older
# root available only through `setup.sh --hosts codex` for legacy installs.
enabled: false
frontmatter:
  required:
    - name
    - description
  # Conservative cross-host listing limit used by doctor.
  description_max_chars: 1024
