# zstack skill registry
# status: active | draft | deprecated
# hosts: agents | claude | codex | grok
# tags: unique kebab-case values; every skill includes indie
# All skill ids MUST use the z- prefix (OSS collision safety).
version: 1
skills:
  - id: z-market-validate
    path: skills/z-market-validate
    status: active
    category: research
    hosts:
      - agents
      - claude
      - codex
      - grok
    tags:
      - indie
      - research
      - validation
      - market
    summary: >-
      Multi-channel market validation for rough ideas — demand signals,
      indie fit, short-term return odds, and entry wedges.

  - id: z-write-prd
