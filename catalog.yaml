      - indie
      - product
      - prd
      - specs
    summary: >-
      Professional PRD authoring from provided notes, research, or drafts —
      scoped for independent developers with testable MVP requirements.

  - id: z-seo-plan
    path: skills/z-seo-plan
    status: active
