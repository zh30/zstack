      measurement plan, 30/60/90 backlog, and explicit avoid list.
    must:
      - Use only applicable canonical names in the Evidence classes field.
      - Preserve supplied-note limits, search uncertainty, contradictory SERP evidence, source anchors, and one bounded next validation.
    must_not:
      - Merge risks and Evidence handoff into free text or rename the fixed rows.
      - Promote search opportunity, planned pages, or guessed bands into observed ranking, traffic, payment, product-market-fit, or retention proof.
